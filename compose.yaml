x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp
  restart: unless-stopped

name: vito

services:
  discord:
    <<: *hardening
    mem_limit: 256m
    pids_limit: 128
    build: .
    image: vito-discord:${VITO_VERSION:-latest}
    container_name: vito-discord
    restart: unless-stopped
    init: true
    volumes:
      - type: bind
        source: ${VITO_ENV_FILE:-./.env}
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
    networks:
      - core_net
    logging:
      options:
        max-size: 10m
        max-file: "3"

networks:
  core_net:
    external: true
